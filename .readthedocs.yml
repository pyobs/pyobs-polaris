version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  apt_packages:
    - doxygen
  jobs:
    pre_build:
      - doxygen Doxyfile
      - doxysphinx build docs/source docs/build/html Doxyfile

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt
